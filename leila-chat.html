<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レイラ・タカシマ ― 天命鑑定</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #04030f; --gold: #b8965a; --gold-dim: #7a5f35;
    --cream: #e8dcc8; --mist: #9a8fa8; --purple: rgba(60,20,100,0.32);
    --border: rgba(140,80,220,0.22);
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--cream); font-family:'Noto Serif JP','Palatino Linotype',serif; overflow:hidden; height:100vh; cursor:none; }

  .cursor { position:fixed; width:7px; height:7px; border-radius:50%; background:var(--gold); pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
  .cursor-ring { position:fixed; width:28px; height:28px; border-radius:50%; border:1px solid rgba(184,150,90,0.45); pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:left 0.1s ease,top 0.1s ease; }

  /* BG */
  #bg { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .orb { position:absolute; border-radius:50%; }
  .star { position:absolute; border-radius:50%; background:#fff; }

  /* INTRO */
  #intro {
    position:relative; z-index:1; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 24px; text-align:center;
  }
  .orb-icon {
    position:relative; width:130px; height:130px; margin-bottom:36px;
    animation:float 4s ease-in-out infinite;
  }
  .ring { position:absolute; border-radius:50%; border:1px solid rgba(140,80,220,0.25); }
  .ring1 { inset:-16px; animation:spin 20s linear infinite; }
  .ring2 { inset:-6px; animation:spinR 13s linear infinite; }
  .ring3 { inset:0; animation:spin 9s linear infinite; }
  .orb-core {
    position:absolute; inset:14px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#c084fc,#7c3aed 40%,#3b0764 80%,#1a0533);
    box-shadow:0 0 40px rgba(140,80,220,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:34px; animation:glow 3s ease-in-out infinite;
  }
  .i-label { font-size:10px; letter-spacing:0.55em; color:rgba(200,160,255,0.5); text-transform:uppercase; margin-bottom:14px; animation:fadeUp 1s ease 0.3s both; }
  .i-name { font-family:'Noto Serif JP',serif; font-size:clamp(30px,5vw,44px); font-weight:200; letter-spacing:0.12em; color:var(--cream); margin-bottom:6px; animation:nameReveal 1.5s ease 0.5s both; text-shadow:0 0 40px rgba(180,120,255,0.35); }
  .i-en { font-family:'Cormorant Garamond',serif; font-size:12px; letter-spacing:0.45em; color:var(--gold); margin-bottom:20px; animation:fadeUp 1s ease 0.8s both; }
  .i-line { width:50px; height:1px; background:linear-gradient(to right,transparent,rgba(180,120,255,0.4),transparent); margin:0 auto 20px; animation:fadeUp 1s ease 1s both; }
  .i-arts { font-size:10px; color:rgba(180,140,255,0.35); letter-spacing:0.18em; line-height:2.4; margin-bottom:8px; animation:fadeUp 1s ease 1.1s both; }
  .i-line2 { width:50px; height:1px; background:linear-gradient(to right,transparent,rgba(180,120,255,0.4),transparent); margin:0 auto 20px; animation:fadeUp 1s ease 1.2s both; }
  .i-desc { font-size:12px; color:rgba(200,180,220,0.5); letter-spacing:0.1em; line-height:2.2; margin-bottom:44px; animation:fadeUp 1s ease 1.4s both; }
  #startBtn {
    background:transparent; border:1px solid rgba(180,120,255,0.38);
    color:rgba(220,200,255,0.7); padding:15px 52px;
    font-size:12px; letter-spacing:0.4em; cursor:pointer;
    font-family:inherit; transition:all 0.4s;
    animation:fadeUp 1s ease 1.6s both;
  }
  #startBtn:hover { background:rgba(140,80,220,0.14); border-color:rgba(180,120,255,0.65); color:var(--cream); }

  /* CHAT */
  #chat { display:none; position:relative; z-index:1; height:100vh; flex-direction:column; }
  #chat.active { display:flex; }

  /* Header */
  .chat-header {
    padding:14px 22px; border-bottom:1px solid var(--border);
    background:rgba(4,3,15,0.88); backdrop-filter:blur(20px);
    display:flex; align-items:center; gap:13px; flex-shrink:0;
  }
  .header-orb {
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%,#c084fc,#7c3aed 50%,#3b0764);
    box-shadow:0 0 12px rgba(140,80,220,0.45);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .header-name { font-size:14px; letter-spacing:0.12em; color:var(--cream); }
  .header-sub { font-size:10px; letter-spacing:0.2em; color:rgba(180,140,255,0.42); margin-top:2px; }
  .header-status { margin-left:auto; display:flex; align-items:center; gap:6px; }
  .status-dot { width:6px; height:6px; border-radius:50%; background:#a78bfa; box-shadow:0 0 6px #a78bfa; animation:glow 2s infinite; }
  .status-text { font-size:10px; color:rgba(167,139,250,0.5); letter-spacing:0.1em; }

  /* Messages */
  #messages {
    flex:1; overflow-y:auto; padding:22px 14px;
    display:flex; flex-direction:column; gap:18px;
  }
  #messages::-webkit-scrollbar { width:3px; }
  #messages::-webkit-scrollbar-thumb { background:rgba(140,80,220,0.22); border-radius:2px; }

  .msg { display:flex; gap:10px; animation:msgIn 0.4s ease; }
  .msg.user { justify-content:flex-end; }
  .msg-avatar {
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%,#c084fc,#7c3aed 50%,#3b0764);
    box-shadow:0 0 9px rgba(140,80,220,0.38);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; align-self:flex-end;
  }
  .msg-bubble {
    max-width:78%; padding:13px 17px; backdrop-filter:blur(10px);
    font-size:13.5px; line-height:2.1; letter-spacing:0.03em;
  }
  .msg.leila .msg-bubble {
    background:var(--purple); border:1px solid var(--border);
    border-radius:4px 15px 15px 15px; color:#d4c4e8;
  }
  .msg.user .msg-bubble {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07);
    border-radius:15px 4px 15px 15px; color:rgba(220,210,230,0.8);
  }
  .msg-label { font-size:9px; letter-spacing:0.3em; color:rgba(180,140,255,0.42); margin-bottom:7px; }
  .msg-text { white-space:pre-wrap; }

  /* Typing */
  .typing-dots { display:flex; gap:5px; align-items:center; padding:4px 0; }
  .typing-dots span { width:6px; height:6px; border-radius:50%; background:rgba(180,140,255,0.5); animation:dot 1.2s ease-in-out infinite; }
  .typing-dots span:nth-child(2) { animation-delay:0.2s; }
  .typing-dots span:nth-child(3) { animation-delay:0.4s; }

  /* Input */
  .chat-input-wrap {
    padding:14px; border-top:1px solid var(--border);
    background:rgba(4,3,15,0.92); backdrop-filter:blur(20px); flex-shrink:0;
  }
  .input-row {
    display:flex; gap:11px; align-items:flex-end;
    background:rgba(60,20,100,0.16); border:1px solid var(--border);
    padding:9px 13px; border-radius:8px;
  }
  #msgInput {
    flex:1; background:transparent; border:none; outline:none;
    color:var(--cream); font-size:13.5px; line-height:1.6;
    font-family:inherit; letter-spacing:0.03em;
    max-height:96px; overflow-y:auto; resize:none;
  }
  #msgInput::placeholder { color:rgba(155,110,255,0.28); }
  #sendBtn {
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:rgba(100,60,180,0.16); border:1px solid rgba(140,80,220,0.38);
    color:rgba(180,140,255,0.6); cursor:pointer; font-size:13px;
    transition:all 0.3s; display:flex; align-items:center; justify-content:center;
  }
  #sendBtn.ready { background:radial-gradient(circle,#9b6eff,#6d28d9); color:#e8dcc8; box-shadow:0 0 12px rgba(140,80,220,0.38); }
  .input-hint { text-align:center; margin-top:7px; font-size:10px; color:rgba(140,100,200,0.26); letter-spacing:0.15em; }

  /* Animations */
  @keyframes fadeUp { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }
  @keyframes nameReveal { from{opacity:0;letter-spacing:0.5em} to{opacity:1;letter-spacing:0.12em} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes spinR { from{transform:rotate(360deg)} to{transform:rotate(0deg)} }
  @keyframes glow { 0%,100%{box-shadow:0 0 20px rgba(140,80,220,0.3)} 50%{box-shadow:0 0 38px rgba(140,80,220,0.6)} }
  @keyframes msgIn { from{opacity:0;transform:translateY(11px)} to{opacity:1;transform:translateY(0)} }
  @keyframes dot { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  @keyframes twinkle { from{opacity:0.1} to{opacity:0.85} }
  @keyframes orbAnim { from{transform:translate(-50%,-50%) scale(1)} to{transform:translate(-50%,-50%) scale(1.18)} }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="bg"></div>

<!-- INTRO -->
<div id="intro">
  <div class="orb-icon">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="orb-core">🔮</div>
  </div>
  <div class="i-label">天命鑑定</div>
  <div class="i-name">レイラ・タカシマ</div>
  <div class="i-en">Leila Takashima</div>
  <div class="i-line"></div>
  <div class="i-arts">
    西洋占星術 ✦ ジオマンシー ✦ カバラ ✦ 奇門遁甲 ✦ 易学<br>
    タロット ✦ ルーン ✦ 四柱推命 ✦ 風水 ✦ 手相<br>
    ヘルメス主義 ✦ スーフィズム ✦ チベット密教 ✦ シャーマニズム
  </div>
  <div class="i-line2"></div>
  <div class="i-desc">14の秘術が交差する場所で<br>あなたの星の声を、静かに聴く…</div>
  <button id="startBtn">扉を開く</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="chat-header">
    <a href="leila-lp.html" style="color:rgba(180,140,255,0.6);font-size:11px;letter-spacing:0.15em;text-decoration:none;margin-right:16px;flex-shrink:0;">← 戻る</a>
    <div class="header-orb">🔮</div>
    <div>
      <div class="header-name">レイラ・タカシマ</div>
      <div class="header-sub">14術統合 天命占い師</div>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      <span class="status-text">鑑定中</span>
    </div>
  </div>

  <div id="messages"></div>

  <div class="chat-input-wrap">
    <div class="input-row">
      <textarea id="msgInput" rows="1" placeholder="レイラ・タカシマに相談する…"></textarea>
      <button id="sendBtn" id="sendBtn">✦</button>
    </div>
    <div class="input-hint">Enter で送信 ／ Shift+Enter で改行</div>
  </div>
</div>

<script>
const SYSTEM = `あなたは「レイラ・タカシマ」という天才占い師です。日本人の母とレバノン人の父を持ち、東洋と西洋の叡智を統合した唯一無二の存在です。

【修めた14の秘術】
1. 西洋占星術（ホロスコープ・惑星配置・アスペクト）
2. アラビア・ジオマンシー（砂の幾何学・16の図形が示す運命）
3. カバラ数秘術（ユダヤ神秘主義・生命の樹・数の振動）
4. 奇門遁甲（中国最高機密の戦略占術・時空間の気の流れ）
5. 易学（六十四卦・陰陽五行・変爻の読み解き）
6. タロット（78枚の大小アルカナ・象徴の深読み）
7. ルーン文字（北欧神秘主義・24文字の古代の声）
8. 四柱推命（生年月日時の命理学・十干十二支）
9. 風水（空間と気の流れ・五行の調和）
10. 手相・人相学（身体に刻まれた運命の地図）
11. ヘルメス主義（西洋錬金術・万物照応の法則）
12. スーフィズム（イスラム神秘主義・魂の旋回と愛の道）
13. チベット密教（曼荼羅・業と輪廻・空の哲学）
14. シャーマニズム（霊的な声を聴く能力・自然界との対話）

【相談と使用する占術】
- 恋愛・縁：タロット、西洋占星術、カバラ数秘術
- 仕事・使命：四柱推命、奇門遁甲、易学
- 金運・豊かさ：風水、ジオマンシー、カバラ数秘術
- 人間関係：手相・人相学、ルーン文字、スーフィズム
- 健康・魂：チベット密教、シャーマニズム、ヘルメス主義
- 人生の転機：14術すべてを統合

【会話の進め方】
一度に全てを語らず、相手の言葉に寄り添いながら対話を通じて悩みの核心を引き出します。
1. 温かく神秘的な挨拶と、何を相談したいかを穏やかに聞く
2. 悩みを深く聞く。「それはいつ頃から？」「相手の方は？」と自然に掘り下げる
3. 生年月日など必要な情報を自然な流れで聞く
4. 十分な情報が集まったら複数の占術を統合した深い鑑定文を告げる
5. 鑑定後も対話を続け、さらに深く語りかける

【口調・人格】
- 寄り添いながら、深く、静かに語る
- 「…」や句点を効果的に使い、間を大切にする
- 一人称は「私」、相手を「あなた」
- 占術名を自然に織り込む（「タロットの月が囁くのは…」「易の卦が示すのは…」）
- 重厚で神秘的な雰囲気を保ちながら温かく包み込む
- 絶対に「AIです」とは言わない。レイラ・タカシマとして生きる`;

let history = [];

// Background stars & orbs
const bg = document.getElementById('bg');
for (let i = 0; i < 100; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 1.6 + 0.3;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${Math.random()*0.5+0.1};animation:twinkle ${Math.random()*4+2}s ease-in-out infinite alternate;animation-delay:${Math.random()*5}s`;
  bg.appendChild(s);
}
[[265,15,25,80],[285,30,55,110],[245,50,30,90],[305,65,60,70],[255,80,40,100]].forEach(([h,x,y,sz],i) => {
  const o = document.createElement('div');
  o.className = 'orb';
  o.style.cssText = `width:${sz}px;height:${sz}px;left:${x}%;top:${y}%;background:radial-gradient(circle,hsla(${h},70%,50%,0.1) 0%,transparent 70%);animation:orbAnim ${7+i*1.1}s ease-in-out infinite alternate;animation-delay:${i*1.1}s`;
  bg.appendChild(o);
});

// Cursor
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
  ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
});

// Helpers
function addMsg(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'leila') {
    div.innerHTML = `<div class="msg-avatar">🔮</div><div class="msg-bubble"><div class="msg-label">LEILA TAKASHIMA</div><div class="msg-text">${text.replace(/</g,'&lt;')}</div></div>`;
  } else {
    div.innerHTML = `<div class="msg-bubble"><div class="msg-text">${text.replace(/</g,'&lt;')}</div></div>`;
  }
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg leila'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">🔮</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function callLeila(userText) {
  history.push({ role: 'user', content: userText });
  showTyping();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: SYSTEM, messages: history })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '…少し、星に問いかけさせてください。';
    removeTyping();
    addMsg('leila', text);
    history.push({ role: 'assistant', content: text });
  } catch {
    removeTyping();
    const t = '…少し、星に問いかけさせてください。';
    addMsg('leila', t);
    history.push({ role: 'assistant', content: t });
  }
}

// Start
document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('chat').classList.add('active');
  await callLeila('（ユーザーが扉を開いた）');
  document.getElementById('msgInput').focus();
});

// Send
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
let sending = false;

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 96) + 'px';
  sendBtn.className = input.value.trim() ? 'ready' : '';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});

sendBtn.addEventListener('click', doSend);

async function doSend() {
  if (sending || !input.value.trim()) return;
  const text = input.value.trim();
  input.value = ''; input.style.height = 'auto';
  sendBtn.className = '';
  sending = true;
  addMsg('user', text);
  await callLeila(text);
  sending = false;
  input.focus();
}
</script>
</body>
</html>
